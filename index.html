<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主要取引先カタログ一覧</title>
<style>
  :root {
    --bg:        #F7F5F0;
    --surface:   #FFFFFF;
    --surface-2: #F0ECE4;
    --ink:       #2C2620;
    --ink-sub:   #6E655B;
    --border:    #DDD6C8;
    --green:     #4A6B4A;
    --green-dk:  #365236;
    --green-lt:  #E7F0E7;
    --accent:    #8C7355;
    --danger:    #B54242;
    --danger-lt: #F9EAEA;
    --radius:    6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─── */
  .site-header {
    background: var(--ink);
    color: #F7F5F0;
    padding: 24px 20px;
  }
  .header-inner {
    max-width: 1160px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .site-header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ─── BUTTONS ─── */
  .btn {
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    padding: 7px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: inherit;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-add {
    background: var(--green);
    color: #fff;
  }
  .btn-add:hover { background: var(--green-dk); }
  .btn-ghost {
    background: rgba(255,255,255,0.12);
    color: #F7F5F0;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.22); }

  /* ─── FILTER BAR ─── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 10px 20px;
  }
  .filter-inner {
    max-width: 1160px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .filter-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-sub);
    border-radius: 4px;
    padding: 4px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.12s;
  }
  .filter-btn:hover {
    border-color: var(--green);
    color: var(--ink);
  }
  .filter-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .count-text {
    margin-left: auto;
    font-size: 0.78rem;
    color: var(--ink-sub);
  }

  /* ─── MAIN GRID ─── */
  .card-grid {
    max-width: 1160px;
    width: 100%;
    margin: 24px auto 48px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
    flex: 1;
  }

  /* ─── CARD ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(44, 38, 32, 0.06);
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kana-badge {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--green-lt);
    color: var(--green-dk);
    font-size: 0.74rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-name {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .card-tools {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .icon-btn {
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.72rem;
    color: var(--ink-sub);
    font-family: inherit;
    transition: all 0.12s;
  }
  .icon-btn:hover {
    background: var(--surface-2);
    color: var(--ink);
  }
  .icon-btn.del:hover {
    background: var(--danger-lt);
    color: var(--danger);
  }

  .card-desc {
    font-size: 0.8rem;
    color: var(--ink-sub);
    margin-bottom: 14px;
    flex: 1;
    line-height: 1.6;
  }
  .card-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .link-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
  }
  .link-btn.primary {
    background: var(--green);
    color: #fff;
  }
  .link-btn.primary:hover { background: var(--green-dk); }
  .link-btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .link-btn.secondary:hover {
    background: var(--surface-2);
    border-color: var(--accent);
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 25, 20, 0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
  }
  .modal h2 {
    font-size: 1.05rem;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .form-row { margin-bottom: 14px; }
  .form-row-inline {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 10px;
    margin-bottom: 14px;
  }
  .form-row label, .form-row-inline label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 4px;
  }
  .req { color: var(--danger); }
  input[type="text"], input[type="url"], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.85rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--green);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 68px; }

  .link-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .link-item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .link-item-title {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--ink-sub);
  }
  .preset-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }
  .preset-chip {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-sub);
    border-radius: 3px;
    padding: 2px 7px;
    font-size: 0.7rem;
    font-family: inherit;
  }
  .preset-chip:hover {
    border-color: var(--green);
    color: var(--green-dk);
  }
  .btn-rm-link {
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 0.72rem;
    font-family: inherit;
    font-weight: 600;
  }
  .btn-add-link {
    cursor: pointer;
    width: 100%;
    padding: 7px;
    border: 1px dashed var(--green);
    border-radius: 4px;
    background: transparent;
    color: var(--green-dk);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-add-link:hover { background: var(--green-lt); }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-sub);
  }
  .btn-cancel:hover { background: var(--surface-2); }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--ink);
    color: #fff;
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 300;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─── FOOTER ─── */
  .site-footer {
    text-align: center;
    padding: 16px;
    font-size: 0.74rem;
    color: var(--ink-sub);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <h1>主要取引先カタログ一覧</h1>
    <div class="header-actions">
      <button class="btn btn-add" onclick="openAddModal()">＋ メーカー追加</button>
      <button class="btn btn-ghost" onclick="exportJson()">JSON書き出し</button>
      <button class="btn btn-ghost" onclick="triggerImport()">JSON読込</button>
    </div>
  </div>
</header>

<nav class="filter-bar" aria-label="五十音フィルター">
  <div class="filter-inner" id="kana-filter"></div>
</nav>

<main class="card-grid" id="card-grid"></main>

<footer class="site-footer">主要取引先カタログ一覧（ブラウザ自動保存対応）</footer>

<!-- モーダル：メーカー追加／編集 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">メーカー追加</h2>
    <div class="form-row-inline">
      <div>
        <label for="f-name">会社名 <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="例：サカタのタネ">
      </div>
      <div>
        <label for="f-kana">頭文字 <span class="req">*</span></label>
        <select id="f-kana"></select>
      </div>
    </div>
    <div class="form-row">
      <label for="f-desc">主な製品・メモ</label>
      <textarea id="f-desc" placeholder="例：主な製品：ホスカル、ホストップ"></textarea>
    </div>
    <div class="form-row">
      <label>リンク <span class="req">*</span></label>
      <div id="link-list"></div>
      <button type="button" class="btn-add-link" onclick="addLinkRow()">＋ リンクを追加</button>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
      <button type="button" class="btn btn-add" onclick="confirmModal()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json" style="display:none" onchange="handleImport(event)">

let suppliers = loadData();
let nextId = suppliers.length ? Math.max(...suppliers.map(s => s.id)) + 1 : 1;
let activeKana = 'all';
let editingId = null;

/* ─── 永続化（localStorage） ─── */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(INIT_DATA));
}

function persistData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(suppliers));
  } catch (e) {
    showToast('自動保存に失敗しました');
  }
}

/* ─── ソート・描画 ─── */
function kanaSort(a, b) {
  const ia = KANA_ORDER.indexOf(a.kana);
  const ib = KANA_ORDER.indexOf(b.kana);
  if (ia !== ib) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return a.name.localeCompare(b.name, 'ja');
}

function initKanaSelect() {
  const sel = document.getElementById('f-kana');
  sel.innerHTML = KANA_ORDER.map(k => `<option value="${k}">${k}</option>`).join('');
}

function renderAll() {
  renderFilter();
  renderCards();
}

function renderFilter() {
  const sorted = [...suppliers].sort(kanaSort);
  const usedKana = [];
  sorted.forEach(s => { if (!usedKana.includes(s.kana)) usedKana.push(s.kana); });

  if (activeKana !== 'all' && !usedKana.includes(activeKana)) {
    activeKana = 'all';
  }

  const wrap = document.getElementById('kana-filter');
  wrap.innerHTML = '';

  const mkBtn = (label, val) => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (val === activeKana ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { activeKana = val; renderFilter(); renderCards(); };
    wrap.appendChild(b);
  };

  mkBtn('すべて', 'all');
  usedKana.forEach(k => mkBtn(k, k));

  const countSpan = document.createElement('span');
  countSpan.className = 'count-text';
  countSpan.id = 'count-label';
  wrap.appendChild(countSpan);
}

function renderCards() {
  const grid = document.getElementById('card-grid');
  const sorted = [...suppliers].sort(kanaSort);
  const filtered = activeKana === 'all' ? sorted : sorted.filter(s => s.kana === activeKana);

  grid.innerHTML = '';
  filtered.forEach(s => grid.appendChild(buildCard(s)));

  const label = document.getElementById('count-label');
  if (label) {
    label.textContent = activeKana === 'all'
      ? `全 ${filtered.length} 件`
      : `「${activeKana}」 ${filtered.length} 件`;
  }
}

function buildCard(s) {
  const div = document.createElement('article');
  div.className = 'card';

  const linksHTML = s.links.map((l, idx) =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" class="link-btn ${idx === 0 ? 'primary' : 'secondary'}">${esc(l.label)}</a>`
  ).join('');

  div.innerHTML = `
    <div class="card-head">
      <div class="card-title-wrap">
        <span class="kana-badge">${esc(s.kana)}</span>
        <h2 class="card-name">${esc(s.name)}</h2>
      </div>
      <div class="card-tools">
        <button type="button" class="icon-btn" onclick="openEditModal(${s.id})">編集</button>
        <button type="button" class="icon-btn del" onclick="deleteCard(${s.id})">削除</button>
      </div>
    </div>
    <p class="card-desc">${esc(s.desc || '—')}</p>
    <div class="card-links">${linksHTML}</div>
  `;
  return div;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ─── モーダル操作 ─── */
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'メーカー追加';
  document.getElementById('f-name').value = '';
  document.getElementById('f-kana').value = activeKana === 'all' ? 'あ' : activeKana;
  document.getElementById('f-desc').value = '';
  document.getElementById('link-list').innerHTML = '';
  addLinkRow({ label: '公式サイト', url: '' });
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-name').focus();
}

function openEditModal(id) {
  const s = suppliers.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  document.getElementById('modal-title').textContent = `編集：${s.name}`;
  document.getElementById('f-name').value = s.name;
  document.getElementById('f-kana').value = KANA_ORDER.includes(s.kana) ? s.kana : 'あ';
  document.getElementById('f-desc').value = s.desc || '';
  const ll = document.getElementById('link-list');
  ll.innerHTML = '';
  s.links.forEach(l => addLinkRow(l));
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function addLinkRow(preset) {
  const ll = document.getElementById('link-list');
  const g = document.createElement('div');
  g.className = 'link-item';

  const chips = LINK_PRESETS.map(p =>
    `<button type="button" class="preset-chip" onclick="setPresetLabel(this, '${p}')">${p}</button>`
  ).join('');

  g.innerHTML = `
    <div class="link-item-head">
      <span class="link-item-title">リンク</span>
      <button type="button" class="btn-rm-link" onclick="removeLinkRow(this)">削除</button>
    </div>
    <div class="preset-wrap">${chips}</div>
    <div style="margin-bottom:6px">
      <input type="text" class="lbl" placeholder="ボタン名（例：公式サイト）" value="${esc(preset?.label ?? '')}">
    </div>
    <div>
      <input type="url" class="url" placeholder="https://..." value="${esc(preset?.url ?? '')}">
    </div>
  `;
  ll.appendChild(g);
  reindexLinks();
}

function setPresetLabel(btn, text) {
  const item = btn.closest('.link-item');
  item.querySelector('.lbl').value = text;
  item.querySelector('.url').focus();
}

function removeLinkRow(btn) {
  const ll = document.getElementById('link-list');
  if (ll.children.length <= 1) {
    showToast('リンクは最低1つ必要です');
    return;
  }
  btn.closest('.link-item').remove();
  reindexLinks();
}

function reindexLinks() {
  document.querySelectorAll('.link-item').forEach((g, i) => {
    g.querySelector('.link-item-title').textContent = `リンク ${i + 1}`;
  });
}

function confirmModal() {
  const name = document.getElementById('f-name').value.trim();
  const kana = document.getElementById('f-kana').value;
  const desc = document.getElementById('f-desc').value.trim();

  if (!name) { showToast('会社名を入力してください'); return; }

  const links = [];
  document.querySelectorAll('.link-item').forEach((g, i) => {
    const label = g.querySelector('.lbl').value.trim();
    const url = g.querySelector('.url').value.trim();
    if (label && url) links.push({ label, url, primary: i === 0 });
  });

  if (links.length === 0) {
    showToast('リンクのボタン名とURLを入力してください');
    return;
  }

  if (editingId !== null) {
    const idx = suppliers.findIndex(x => x.id === editingId);
    if (idx !== -1) suppliers[idx] = { id: editingId, kana, name, desc, links };
    showToast('更新して保存しました');
  } else {
    suppliers.push({ id: nextId++, kana, name, desc, links });
    showToast('追加して保存しました');
  }

  persistData();
  closeModal();
  renderAll();
}

function deleteCard(id) {
  const target = suppliers.find(s => s.id === id);
  if (!target) return;
  if (!confirm(`「${target.name}」を削除しますか？`)) return;
  suppliers = suppliers.filter(s => s.id !== id);
  persistData();
  renderAll();
  showToast('削除しました');
}

/* ─── JSON 書き出し／読み込み（バックアップ・他PC移行用） ─── */
function exportJson() {
  const json = JSON.stringify(suppliers, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = URL.createObjectURL(blob);
  a.download = `catalog_backup_${ymd}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSONファイルを書き出しました');
}

function triggerImport() {
  document.getElementById('file-input').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('配列形式ではありません');
      suppliers = data;
      nextId = suppliers.length ? Math.max(...suppliers.map(s => Number(s.id) || 0)) + 1 : 1;
      activeKana = 'all';
      persistData();
      renderAll();
      showToast(`${suppliers.length}件のデータを読み込みました`);
    } catch (err) {
      showToast('読み込み失敗：' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

/* ─── Toast ─── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ─── イベント・初期化 ─── */
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

initKanaSelect();
renderAll();
</script>
